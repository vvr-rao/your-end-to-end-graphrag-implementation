name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Run every Python version even if one fails, so the matrix reports
      # exactly which versions pass.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run tests with coverage
        # The fast suite (-m 'not slow', from pyproject addopts) needs no
        # live Postgres -- DB/large-ontology tests are @slow or self-skip.
        # Coverage is printed to the CI log only; not published anywhere.
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term-missing

  cross-platform-helpers:
    # Verify the cross-platform skill helpers + durable-run harness on all three
    # OSes. Scoped to the helper tests (not the full suite) so it proves the
    # portable building blocks without depending on the whole suite being
    # OS-portable. This is what lets the build flow claim macOS + Windows support.
    name: helpers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --python 3.12

      - name: Test skill helpers + durable harness (cross-platform)
        run: uv run --python 3.12 pytest backend/tests/unit/test_skill_helpers.py -v

      # Every skill command must run unchanged in bash, zsh and PowerShell --
      # the 2026-08-01 audit (2424ef2) as a test, after three bash-only
      # commands crept back in by 2026-10-22.
      - name: Test skill commands are shell-neutral
        run: uv run --python 3.12 pytest backend/tests/unit/test_skills_shell_neutral.py -v

      # The ontology-build units the DeepInfra/scaling work added (junk rules,
      # pairwise dedup, audit, Stage-4 class indexes, concept-grouping batches,
      # GPU + memory sizing, the alias miner + LLM judge) are pure Python, so
      # they must pass on every OS the skills support. The staging-store and Stage-2 streaming round trips
      # need Postgres (ONTOLOGY_BUILD_TEST_DSN) and skip here.
      - name: Test ontology-build units (cross-platform)
        run: >-
          uv run --python 3.12 pytest -v
          backend/tests/unit/test_class_junk_filter.py
          backend/tests/unit/test_pairwise_dedup.py
          backend/tests/unit/test_dedup_audit.py
          backend/tests/unit/test_adverse_event_taxonomy.py
          backend/tests/unit/test_concept_grouping_batches.py
          backend/tests/unit/test_class_indexes.py
          backend/tests/unit/test_ontology_build_store.py
          backend/tests/unit/test_stage2_streaming.py
          backend/tests/unit/test_semantic_grouping.py
          backend/tests/unit/test_deepinfra_mode.py
          backend/tests/unit/test_tpm_check.py
          backend/tests/unit/test_alias_mining.py
          backend/tests/unit/test_alias_judge.py
          backend/tests/unit/test_memory_probe.py
          backend/tests/unit/test_run_stats.py
          backend/tests/unit/test_table_page_vision.py
          backend/tests/unit/test_table_cache.py
          backend/tests/unit/test_generic_concepts.py
