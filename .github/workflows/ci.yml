name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Run every Python version even if one fails, so the matrix reports
      # exactly which versions pass.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    # A throwaway pgvector database so the DB round-trip tests run instead of
    # skipping (structured-data load/link/SQL, staging store, Stage-2
    # streaming). Service containers are Linux-only on GitHub, so these run
    # here and self-skip in the macOS/Windows job. The database name must end
    # in _test: test_structured_db TRUNCATEs graph tables.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: yegi
          POSTGRES_PASSWORD: yegi
          POSTGRES_DB: yegi_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yegi -d yegi_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ONTOLOGY_BUILD_TEST_DSN: postgresql://yegi:yegi@localhost:5432/yegi_ci_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --extra hf --extra structured --python ${{ matrix.python-version }}

      - name: Migrate the test database
        env:
          DATABASE_URL: postgresql://yegi:yegi@localhost:5432/yegi_ci_test
          BEARER_TOKEN: ci-only
        run: uv run --python ${{ matrix.python-version }} python -m backend.app.cli db-migrate

      - name: Run tests with coverage
        # The fast suite (-m 'not slow', from pyproject addopts) needs no
        # live Postgres -- DB/large-ontology tests are @slow or self-skip.
        # Coverage is printed to the CI log only; not published anywhere.
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term-missing

  cross-platform-helpers:
    # Verify the cross-platform skill helpers + durable-run harness on all three
    # OSes. Scoped to the helper tests (not the full suite) so it proves the
    # portable building blocks without depending on the whole suite being
    # OS-portable. This is what lets the build flow claim macOS + Windows support.
    name: helpers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --extra hf --extra structured --python 3.12

      - name: Test skill helpers + durable harness (cross-platform)
        run: uv run --python 3.12 pytest backend/tests/unit/test_skill_helpers.py -v

      # Every skill command must run unchanged in bash, zsh and PowerShell --
      # the 2026-08-01 audit (2424ef2) as a test, after three bash-only
      # commands crept back in by 2026-10-22.
      - name: Test skill commands are shell-neutral
        run: uv run --python 3.12 pytest backend/tests/unit/test_skills_shell_neutral.py -v

      # source_documents/structured_download.py and its structured/ package are
      # run directly by users on any OS (paths, atomic .part renames, archive
      # extraction, CSV newline/encoding handling). Fixture-only, no network.
      # The EDGAR HTML->PDF test is deselected: WeasyPrint needs GTK system
      # libraries (libgobject) that the macOS/Windows runners do not ship.
      - name: Test structured-data downloaders (cross-platform)
        run: >-
          uv run --python 3.12 pytest -v
          backend/tests/unit/test_structured_core.py
          backend/tests/unit/test_structured_sources.py
          backend/tests/unit/test_source_doc_downloaders.py
          backend/tests/unit/test_hf_dataset.py
          backend/tests/unit/test_supplementary_download.py
          backend/tests/unit/test_build_crosswalk.py
          --deselect backend/tests/unit/test_source_doc_downloaders.py::test_edgar_html_to_pdf_returns_pdf_bytes

      # The ontology-build units the DeepInfra/scaling work added (junk rules,
      # pairwise dedup, audit, Stage-4 class indexes, concept-grouping batches,
      # GPU + memory sizing, the alias miner + LLM judge) are pure Python, so
      # they must pass on every OS the skills support. The staging-store and Stage-2 streaming round trips
      # need Postgres (ONTOLOGY_BUILD_TEST_DSN) and skip here.
      - name: Test ontology-build units (cross-platform)
        run: >-
          uv run --python 3.12 pytest -v
          backend/tests/unit/test_class_junk_filter.py
          backend/tests/unit/test_pairwise_dedup.py
          backend/tests/unit/test_dedup_audit.py
          backend/tests/unit/test_adverse_event_taxonomy.py
          backend/tests/unit/test_concept_grouping_batches.py
          backend/tests/unit/test_class_indexes.py
          backend/tests/unit/test_ontology_build_store.py
          backend/tests/unit/test_stage2_streaming.py
          backend/tests/unit/test_semantic_grouping.py
          backend/tests/unit/test_deepinfra_mode.py
          backend/tests/unit/test_tpm_check.py
          backend/tests/unit/test_alias_mining.py
          backend/tests/unit/test_alias_judge.py
          backend/tests/unit/test_memory_probe.py
          backend/tests/unit/test_run_stats.py
          backend/tests/unit/test_table_page_vision.py
          backend/tests/unit/test_table_cache.py
          backend/tests/unit/test_generic_concepts.py

      # Structured-data support: discovery, profiling, the two-tier metadata
      # cache (atomic UTF-8 writes, cache hits make zero LLM calls), the SQL
      # guard, Markdown export/import and the LLM profiler with a fake router.
      # Paths with spaces/Unicode and byte-exact fixtures are the OS-sensitive
      # parts. test_structured_db needs Postgres and self-skips here.
      - name: Test structured-data pipeline (cross-platform)
        run: >-
          uv run --python 3.12 pytest -v
          backend/tests/unit/test_structured_discovery.py
          backend/tests/unit/test_structured_profiling.py
          backend/tests/unit/test_structured_cache.py
          backend/tests/unit/test_structured_sql_guard.py
          backend/tests/unit/test_table_metadata_md.py
          backend/tests/unit/test_structured_profiler.py
          backend/tests/unit/test_structured_retrieval.py
          backend/tests/unit/test_structured_query_builder.py
          backend/tests/unit/test_structured_value_domains.py
          backend/tests/unit/test_structured_db.py
