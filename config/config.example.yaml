# =============================================================================
# config.example.yaml
#
# Copy to config.yaml and edit. config.yaml is gitignored.
#   cp config/config.example.yaml config/config.yaml
#
# Loaded by backend/app/core/config.py via pydantic-settings on startup.
# All paths are relative to the repo root unless absolute.
# =============================================================================

# -----------------------------------------------------------------------------
# Document chunking (tiktoken-based, paragraph-first exact-token packing —
# matches kg_populationv5.ipynb behavior).
# -----------------------------------------------------------------------------
chunking:
  # Target chunk size in tokens (o200k_base encoding). gpt-4.1 handles
  # 2K-token chunks comfortably; the ontology-slice overhead amortizes
  # over fewer Stage-2 calls.
  chunk_size: 2000
  # Overlap between adjacent chunks; helps preserve context across splits.
  chunk_overlap: 150
  # Documents above this many tokens are pre-summarized via gpt-4o-mini
  # before chunking. The summary preserves entities, relationships,
  # conceptual buckets, and proper nouns -- discards repetitive prose.
  # Cuts Stage 2 cost dramatically on corpora dominated by a few large
  # documents. Set to 0 to disable; the pipeline then chunks raw text.
  summarization_threshold_tokens: 2000
  # Persistent disk cache for document summaries at
  # ~/.cache/your-end-to-end-graphrag-implementation/doc_summaries/. Cache
  # key hashes the doc text + model + prompt version, so editing a doc
  # or changing the model invalidates that entry automatically. Re-runs
  # against unchanged docs cost nothing for summarization. Set to false
  # to force every run to re-call the LLM (debugging only).
  use_summary_cache: true
  # Single-call ceiling for summarization. Docs above this many tokens
  # trigger HIERARCHICAL summarization: the doc is split into sub-chunks
  # of `oversize_doc_sub_chunk_tokens` each, each sub-chunk is summarized
  # via gpt-4o-mini independently, and the per-sub-chunk summaries are
  # concatenated into the final combined summary. Default 100K = below
  # gpt-4o-mini's 128K context window with headroom for the prompt
  # template. Docs at/under this size use a single LLM call (cheaper).
  max_doc_input_tokens: 100000
  # Sub-chunk size used when a doc exceeds max_doc_input_tokens and
  # falls into the hierarchical-summarization path. Each sub-chunk gets
  # its own gpt-4o-mini call. 80K keeps each sub-call comfortably under
  # the 128K context limit; raise if you want fewer sub-chunks per doc
  # (slightly more compression risk).
  oversize_doc_sub_chunk_tokens: 80000
  # Number of DOCUMENTS loaded + summarized per batch in the streaming
  # summarize -> chunk pass.
  #
  # THIS SILENTLY CAPS CONCURRENCY. Batches are a hard barrier -- pipeline_llm
  # awaits each one fully before loading the next -- so only the current
  # batch's windows exist:
  #
  #     effective concurrency = min(concurrency.summarization,
  #                                 windows in this batch)
  #     windows per batch    ~= streaming_batch_size x ~2.5 windows/doc
  #
  # At 8 that is ~20 windows, so a concurrency.summarization above ~20 sits
  # IDLE. Measured on a 30-doc corpus: 13 of 32 slots unused. Raising
  # concurrency alone will not help until this moves.
  #
  # Memory cost is small (~50 MB at 16 docs), so 16-32 is usually right on a
  # machine with >2 GB free. Kept at 8 by default: safe on a small-RAM box.
  # Size it for YOUR corpus with:
  #     uv run python scripts/tpm_check.py <documents-dir>
  # Set to 0 to load everything at once (will OOM on a large corpus).
  #
  # Batches are sequential, so a batch also runs at the speed of its SLOWEST
  # document -- one 60k-token doc holds up the other seven.
  streaming_batch_size: 8
  # tiktoken encoding name. o200k_base matches GPT-4o family + recent embedding models.
  encoding: o200k_base

# -----------------------------------------------------------------------------
# Document summarization (ingestion). `method: evaluated` (default) runs the
# near-lossless, section-structured summarizer with an evaluator feedback loop
# (summarize -> question-gen -> evaluate -> revise); `single_pass` uses the older
# one-shot document_summarize. Per-task models live in models.yaml.
# -----------------------------------------------------------------------------
summarization:
  # evaluated | single_pass. register-documents/prune-expand --single-pass-summaries
  # override to the legacy one-shot summarizer. When `evaluated`, BOTH prune-expand
  # and register-documents run the same evaluated summarizer and share the
  # eval_summaries/ cache, so prune-expand warms it and register-documents reuses
  # the summaries for free (keep chunking.summarization_threshold_tokens the same
  # for both -- it decides which docs get summarized; it is NOT in the cache key).
  method: evaluated
  # Concurrent LLM calls for the summarizer, INDEPENDENT of
  # expansion.max_concurrent_llm_calls (Stage 1/2 run on a different model with
  # a different rate limit -- see pipeline_llm for why they must not share one
  # number). Unset => falls back to max_concurrent_llm_calls.
  #
  # Sizing: a 1.6M-token corpus is ~139 windows (12k window - 500 overlap), each
  # up to 9 sequential calls. Wall time ~= (139 / concurrency) * chain_time, so
  # this value divides total runtime almost linearly until you hit a provider
  # limit or local memory.
  #
  # Rate-limit check before raising: concurrency * (input+output tokens per call)
  # * (60 / seconds_per_call) must stay under your model's TPM. At 32 concurrent
  # with ~20k tokens per ~60s call that is ~640k TPM -- 6% of a 10M TPM tier.
  # OpenAI tier 4 is 10M TPM for gpt-4.1-mini, so 32 is conservative there;
  # LOWER it to 4-8 on tier 1-2, where 8 concurrent large calls already throttle.
  concurrency: 8
  # Evaluator revise rounds per chunk (register-documents --eval-rounds overrides).
  # Higher = more fidelity + more cost (~6-9 LLM calls/chunk at 3).
  eval_rounds: 3
  # Source-derived questions generated per chunk to audit preservation.
  questions_per_chunk: 12
  # Source window (tokens) summarized per evaluated chunk.
  max_chunk_tokens: 12000
  # Token overlap between adjacent source windows.
  overlap_tokens: 500
  # Cap on each STORED summary chunk (the evaluated per-chunk summary is split on
  # its section headers into pieces <= this many tokens, so retrieval embeddings
  # stay sharp and the synthesis prompt isn't truncated away). Lossless: all
  # content is retained across the pieces.
  summary_chunk_max_tokens: 1200
  # Auto rollup layers for artifact Summaries (generate-artifacts --type Summary).
  summary_rollup_rounds: 2
  # Revise passes per rollup cluster to guarantee lossless dedup: after each merge,
  # an LLM evaluator lists any dropped facts and a reviser adds them back, up to
  # this many rounds. Applies to ALL rollup types. 0 disables the loop (merge only).
  # Each round adds LLM calls per cluster -- --max-cost-usd bounds the run.
  rollup_eval_rounds: 2
  # Reuse the on-disk summary cache (~/.cache/.../doc_summaries/).
  use_summary_cache: true

# -----------------------------------------------------------------------------
# Embeddings — provider/model lives in models.yaml; these are runtime params.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# LLM call concurrency, per pipeline stage.
#
# WHY PER-STAGE: stages run on different models with very different rate
# limits, so a single number cannot serve them all. Summarization, entity
# extraction and artifact generation run on mini-class models (~10M TPM on
# OpenAI tier 4) making modest calls; expansion Stage 1/2 runs class_proposal
# on gpt-4.1 at max_tokens=32768 against a ~2M TPM tier. Tying them together
# pins the cheap stages to the expensive stage's safe value.
#
# IMPACT: wall time scales close to linearly with these until you hit a
# provider limit. A 1.6M-token corpus at concurrency 4 spent ~4 hours using
# under 1% of a tier-4 allowance; the same work at 32 is ~25 minutes.
#
# SIZING: concurrency x tokens_per_call x (60 / seconds_per_call) must stay
# under the model's TPM. At 32 concurrent, ~20k tokens per ~60s call is
# ~640k TPM -- 6% of a 10M tier. Cost is unchanged by concurrency (same token
# volume), though a higher value slightly lowers the prompt-cache hit rate
# (measured 69% -> 49% at 4 -> 32, about +2% spend).
#
# LOWER THESE on OpenAI tier 1-2, where 8 concurrent large calls already
# throttle and time out. Each CLI also takes --concurrency to override per run.
# -----------------------------------------------------------------------------
concurrency:
  # register-documents / prune-expand summarization. Also settable as
  # summarization.concurrency (kept for back-compat; this wins if both set).
  summarization: 8
  # extract-entities
  entity_extraction: 8
  # generate-artifacts + regenerate-stale-artifacts
  artifact_generation: 8
  # Expansion Stage 1 -- chunk_classification (gpt-4.1-mini, ~10M TPM tier).
  # SEPARATE from class_proposal on purpose: they ran on one semaphore, which
  # pinned this cheap stage to the expensive one's safe value. Measured at 197
  # chunks / ~8 min at 4, where ~1 min would do.
  chunk_classification: 8
  # Expansion Stage 2 -- class_proposal (gpt-4.1 @ max_tokens=32768, ~2M TPM).
  # Measured at only 6.2% of that tier at concurrency 4, so 12-16 is likely
  # safe -- but models.yaml warns that concurrent large gpt-4.1 calls throttle,
  # so raise INCREMENTALLY and watch for 429s. This is 65% of prune-expand cost.
  class_proposal: 4
  # Stage 3 dedup batches (match_dedup, gpt-4.1 @ 32768). Its own knob because
  # batch count scales with proposals, not chunks: a 30-doc run produced 32
  # batches taking ~15-18 min at 4.
  dedup: 4
  # prune-expand --tables / register-documents --tables: how many PDFs are
  # extracted CONCURRENTLY. Each PDF runs in its own subprocess
  # (table_extract_worker) so the kernel reclaims its memory on exit -- the
  # in-process extractor accumulated heap fragmentation and reliably OOMed
  # partway through a corpus on a ~2.7 GB host.
  #
  # DEFAULT 1 IS DELIBERATE and should stay 1 on small-RAM machines.
  #
  # Sizing, from a measured run (125-page pharma label, vision ON):
  #     one worker  ~152 MB RSS, ~340 s per PDF
  #     18 PDFs at concurrency 1 = ~100 minutes, serial
  # So: concurrency ~= (free_MB - 600 reserve) / 200
  #     1855 MB free -> ~6; 2400 MB free -> ~9
  # Check free memory FIRST (`free -m`), and prefer to under-shoot: a
  # pathological PDF (large page rasters for the vision route) can cost several
  # times the average, and an OOM kills the whole run with no swap on this box.
  table_extraction: 1
  # prune-expand --tables: one LLM call per extracted table
  # (table_concept_grouping). Only runs during prune-expand, which has
  # no --concurrency flag, so this is the ONLY way to set it.
  table_mining: 8
  # evaluate-queries (the QA eval harness)
  evaluation: 4

embeddings:
  # Number of texts to send per OpenAI batch call. 100 is a safe default.
  batch_size: 100
  # If true, embed at upload time; else require explicit job trigger.
  embed_on_ingest: true

# -----------------------------------------------------------------------------
# Ontology storage paths (folders already exist with notes.md tracked;
# subdirectories of these folders are gitignored).
# -----------------------------------------------------------------------------
ontology:
  # Drop user-provided .owl source files anywhere under this folder.
  source_dir: ./source_ontologies
  # Generated/exported .owl files land here. Real version control = Postgres `ontology_versions`.
  output_dir: ./output_ontologies
  # Default base IRI for synthetically created classes from "MATCH NOT FOUND" LLM output.
  # Set to your own domain so synthesized class IRIs are dereference-able
  # under your namespace. Hash form is the ontology-modeling convention.
  default_base_iri: https://example.com/ontology/merged#
  # Default parent IRI for proposed-but-unparented classes.
  default_parent_iri: http://www.w3.org/2002/07/owl#Thing
  # IRI prefixes that prune will NEVER remove. Any class whose IRI starts with
  # one of these prefixes is force-included in the prune keep-set regardless
  # of whether the document corpus surfaced it. Use this to preserve your own
  # curated ontologies across prune / prune-expand / build runs.
  # Property survival follows automatically: any object/data property whose
  # domain or range touches a protected class also survives.
  protected_iri_prefixes: []
  # Example (uncomment and edit):
  # protected_iri_prefixes:
  #   - https://your-domain.example.com/ontology/your-curated-ontology
  #   # FOAF (foaf:Person, foaf:Organization, foaf:Agent, foaf:Group)
  #   - http://xmlns.com/foaf/0.1/
  #   # W3C Organization Ontology (org:Organization, org:Role, org:Membership)
  #   - http://www.w3.org/ns/org#

# -----------------------------------------------------------------------------
# LLM expansion run parameters.
# -----------------------------------------------------------------------------
expansion:
  # How many ontology classes to send per LLM batch (matches notebook's split_dict_by_size).
  ontology_chunk_size: 50
  # Concurrency cap for LLM calls inside a run (respects provider rate limits).
  #
  # TUNE THIS PER PROVIDER (set via config/models.yaml). Stage-1
  # chunk_classification sends large prompts (the full top-level BRANCHES list
  # + the chunk text), so the right concurrency depends on which model serves
  # that task:
  #   - Groq (default preset, llama-3.3-70b): very high throughput + low
  #     latency. 8 is fine; you can push higher. Groq is FASTER and CHEAPER for
  #     this high-volume tagging step (~10x cheaper than GPT-4-class), but it's
  #     a second vendor + a second API key + a separate (free-tier) rate limit.
  #   - OpenAI (openai-only preset, gpt-4o-mini): slower per request, and with
  #     8 concurrent large requests against a modest OpenAI tier the calls
  #     queue/throttle and can exceed the task's `timeout`, surfacing as
  #     "Request timed out" in Stage 1. Drop this to ~3-4 AND raise
  #     chunk_classification `timeout` (e.g. 180) in config/models.yaml. The
  #     advantage of OpenAI here is SINGLE-VENDOR simplicity — one key, no Groq.
  # Rule of thumb: Groq -> 8 (or more); OpenAI gpt-4o-mini -> 3-4.
  max_concurrent_llm_calls: 8
  # Hard cost ceiling per run in USD; run aborts if estimated cost exceeds this.
  max_cost_usd: 25.00
  # Default hops for class-graph expansion in pruning step.
  prune_max_hops: 1

  # ---------------------------------------------------------------------------
  # Stage-2 entity-shaped-class filter.
  #
  # The stage-2 LLM occasionally proposes specific named entities (companies,
  # documents, dashboards, country names) as new ONTOLOGY CLASSES instead of
  # INSTANCES. A heuristic post-filter in `pipeline_llm.py` catches and
  # demotes those. The "known places" set is built dynamically from the
  # loaded ontology: any class whose superclass-chain includes Country /
  # Region / Continent / City / State / Province etc. contributes its labels.
  # No code change needed when you import a different geography ontology.
  #
  # The three optional `extra_*` lists below let domain users extend the
  # built-in pattern set without code changes. Empty = use built-ins only.
  # ---------------------------------------------------------------------------
  entity_class_filter:
    # Extra corporate-suffix tokens that mark a label as a company/agency
    # name (and therefore an instance, not a class). Built-ins already
    # include Inc, Corp, Ltd, N.V., GmbH, AG, S.A., Holdings, Group, etc.
    extra_corporate_suffixes: []
    # Extra trailing words that mark a label as a named document / data
    # product / tool. Built-ins already include Report, Dashboard, Tracker,
    # Monitor, Hub, Tool, Database, Calendar, Alert, Portal, Platform, etc.
    extra_doc_tail_words: []
    # Extra place labels (case-insensitive exact-match) for known proper-
    # noun places NOT already in the loaded ontology. Usually empty --
    # the dynamic lookup handles geography automatically.
    extra_known_place_labels: []

# -----------------------------------------------------------------------------
# RAG QA defaults (Phase 2).
# -----------------------------------------------------------------------------
qa:
  # Top-k candidate classes from class-summary ANN.
  k_classes: 15
  # Top-k chunks after graph-aware filtering.
  k_chunks: 20
  # Graph-BFS depth (Milestone-F retrieval step 7): how many hops to walk
  # out from the seed nodes over graph_relationships. Higher = broader
  # evidence but more candidates + cost. `query --hops N` overrides per-run.
  hops: 3
  # Max characters of each evidence item's text placed in the answer-synthesis
  # prompt. Raised from the old hard-coded 600 so richer (e.g. evaluated-summary)
  # chunks aren't clipped down to ~150 tokens at synthesis. ~30 chunks x 1500
  # chars ~= 11k tokens of chunk-context for deep_research -- fine for gpt-4.1.
  evidence_char_cap: 1500
  # For comparison/enumeration queries over multiple entities ("compare A vs its
  # competitors"), retrieval fans out ONE vector probe per matched entity so each
  # gets even representation (instead of only the 1-2 a generic decompose named).
  # Caps how many per-entity probes are generated -- each is one extra rerank pass
  # (sequential on the pooler). 0 disables the fan-out (generic decompose only).
  max_entity_probes: 8

  # --- corpus-mined synonyms (populate with `mine-aliases`) --------------------
  # FDA labels, filings and technical prose state their own synonyms
  # ("MOUNJARO (tirzepatide) injection"). `mine-aliases` extracts those pairs
  # deterministically -- no LLM -- into graphrag.term_aliases; retrieval then
  # expands query terms with them. Without this, a question saying
  # "tirzepatide" cannot reach chunks that only ever say "MOUNJARO": the two
  # words are unrelated in embedding space.
  #
  # How mined aliases enter the vector probes:
  #   blended  -- append to existing probe text ("... of tirzepatide (Mounjaro)").
  #               No extra rerank pass, so no added latency.
  #   separate -- add a dedicated probe per alias ("Dosing schedule of Mounjaro").
  #               Better recall -- a dedicated brand-name probe measurably
  #               outperforms a blended one -- at one extra sequential rerank each.
  #   off      -- aliases still widen graph seeding, but do not touch probes.
  alias_probe_mode: blended
  # Max mined aliases carried per query term (seeding + probes).
  max_aliases: 6
  # Only used when alias_probe_mode: separate. Caps total added probes.
  max_alias_probes: 4

  # --- distance-aware probe fusion --------------------------------------------
  # RRF fuses rank ORDER and throws distance away, so a probe that matched
  # nothing still casts full-strength rank-1..N votes, indistinguishable from a
  # probe that found the right passage. These guards restore that signal.
  # Comment both out to get the previous (rank-only) behavior exactly.
  #
  # UNITS: pgvector `<->` is L2 distance over 1024-dim embeddings, range [0,2].
  # NOT cosine distance -- the two are easy to confuse and differ by roughly a
  # factor of two in this range. Measured on the pharma corpus:
  #     on-topic probes    best hit 0.77 - 0.86
  #     off-topic probes   best hit 1.24 - 1.25
  #     nonsense probes    best hit 1.13
  # 1.05 sits clear of both bands. Re-measure before changing it: embed a few
  # relevant and a few deliberately off-topic probes and take min(distance)
  # over graphrag.chunks.
  #
  # If even the BEST hit is farther than this, the probe found nothing relevant
  # and contributes no votes at all.
  probe_dist_floor: 1.05
  # Keep only results within this L2 distance of the probe's own best hit.
  # OFF by default: measured top-30 spread for a relevant probe is only
  # 0.085-0.107, so any band loose enough to be safe is also loose enough to be
  # a no-op, and a tighter one would discard real evidence. Enable only with
  # measurements from your own corpus.
  # probe_dist_band: 0.10

  # --- document-level recall arm ----------------------------------------------
  # Top-k documents by whole-document embedding similarity, whose chunks join
  # the candidate pool. Surfaces documents that are ABOUT the topic even when no
  # individual chunk matches the query's wording. 0 disables the arm.
  k_documents: 10

# -----------------------------------------------------------------------------
# Background jobs (arq).
# -----------------------------------------------------------------------------
jobs:
  # Max concurrent arq jobs per worker.
  max_jobs: 8
  # Per-job timeout (seconds).
  job_timeout: 3600
  # Max retries on transient failures (LLM 429/5xx are retried inside the router; this is for whole-job retries).
  max_tries: 3

# -----------------------------------------------------------------------------
# Storage backend (raw uploaded files — Phase 3 may swap local→S3/R2).
# -----------------------------------------------------------------------------
storage:
  backend: local   # local | s3 (Phase 3+)
  # Override via STORAGE_DIR env var.
